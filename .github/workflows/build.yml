name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  # the release workflow runs this whole matrix first (.github/workflows/release.yml)
  workflow_call:

# least privilege: CI only reads the repository
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # transparent mode's DNS-over-HTTPS resolver links OpenSSL
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make re
      - run: make test
      - name: smoke test
        run: |
          ./nivyx-engine &
          sleep 1
          curl --socks5 127.0.0.1:1080 -sI https://example.com | tee /tmp/out.txt
          grep -q "HTTP/" /tmp/out.txt
      - name: CLI smoke test
        run: |
          ./nivyx-engine --version
          ./nivyx-engine --capabilities
          ./nivyx-engine --help >/dev/null
      - name: cross-platform command parity (static)
        run: ./scripts/parity-test.sh
      - name: support-bundle redaction
        run: ./scripts/redaction-test.sh
      - name: TLS certificate and hostname verification (local endpoints)
        run: ./scripts/tls-verify-test.sh

  linux-package:
    # The package is built on the oldest supported baseline
    # (Ubuntu 22.04: glibc 2.35, OpenSSL 3.0), so the engine in it also
    # runs on Debian 12, Ubuntu 22.04 and every newer distribution;
    # v2.3.0's package, built on the runner's Ubuntu 24.04, needed glibc 2.38
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config ca-certificates
      - run: make re
      - run: ./scripts/package-linux.sh linux-pkg
      - run: ./scripts/check-linux-package.sh linux-pkg/nivyx-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-linux-x86_64
          path: linux-pkg/nivyx-linux-x86_64.tar.gz

  linux-package-distros:
    # the exact package, unpacked and run on each distribution family with
    # only its own OpenSSL 3 runtime installed (no compiler, no headers)
    needs: linux-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', deps: 'apt-get update && apt-get install -y --no-install-recommends openssl' }
          - { image: 'ubuntu:22.04', deps: 'apt-get update && apt-get install -y --no-install-recommends openssl' }
          - { image: 'ubuntu:24.04', deps: 'apt-get update && apt-get install -y --no-install-recommends openssl' }
          - { image: 'opensuse/tumbleweed', deps: 'zypper -n in libopenssl3 tar gzip' }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.deps }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-linux-x86_64
      - name: the engine and the scripts run here
        run: |
          tar -xzf nivyx-linux-x86_64.tar.gz
          cd nivyx-linux-x86_64
          ./files/nivyx-engine --version
          ./files/nivyx-engine --capabilities | grep -q '^transparent_mode: supported'
          for f in install.sh uninstall.sh update.sh nivyx; do bash -n "./$f"; done
          ./nivyx help >/dev/null
          ./install.sh --help >/dev/null

  linux-source-openssl4:
    # Fedora and Arch ship OpenSSL 4 (libssl.so.4): the prebuilt
    # package (OpenSSL 3) cannot run there, so these install from source -
    # check that the engine builds and its unit tests pass against it
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'fedora:latest', deps: 'dnf install -y gcc make openssl openssl-devel pkgconf-pkg-config' }
          - { image: 'archlinux:latest', deps: 'pacman -Syu --noconfirm base-devel openssl' }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.deps }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: openssl version
      - run: make re && make test
      - name: transparent mode is built in
        run: |
          ./nivyx-engine --capabilities | grep -q '^transparent_mode: supported'

  shellcheck:
    # the installer, uninstaller, CLI and release/install test scripts
    # (SC1007: the `CDPATH= cd` idiom; SC2034: variables kept for readability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: >-
          shellcheck -S warning -e SC1007,SC2034
          scripts/install.sh scripts/uninstall.sh scripts/update.sh scripts/nivyx scripts/package-linux.sh
          scripts/install-deps-test.sh scripts/update-compat-test-linux.sh
          scripts/upgrade-test-linux.sh scripts/e2e-test-linux.sh
          scripts/check-linux-package.sh scripts/sanitize-engine-linux.sh
          scripts/tls-verify-test.sh scripts/build-openssl-tsan.sh
          scripts/windows/package.sh
      # the macOS scripts are POSIX sh (macOS /bin/sh)
      - run: >-
          shellcheck -s sh -S warning -e SC1007,SC2034 scripts/macos/nivyx scripts/macos/update-test.sh
          scripts/macos/upgrade-test.sh scripts/macos/lock-race-test.sh scripts/macos/install.sh
          scripts/macos/uninstall.sh scripts/macos/package.sh
          "scripts/macos/Install Nivyx.command" "scripts/macos/Uninstall Nivyx.command" "scripts/macos/Update Nivyx.command"

  install-deps:
    # the installer's Debian/Ubuntu dependency auto-install, in clean containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/install-deps-test.sh

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make sanitize

  engine-sanitizers:
    # The transparent engine itself (not only the unit tests) under
    # ASan+UBSan and TSan, intercepting real HTTPS and DNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      # TSan-instrumented OpenSSL for the TSan run (pinned source, cached)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-tsan
          key: openssl-tsan-3.5.5-${{ runner.os }}-${{ runner.arch }}-v1
      - run: ./scripts/sanitize-engine-linux.sh "$RUNNER_TEMP/openssl-tsan"

  packet-mode-compile:
    # Real compile+link against real system dev headers, unlike the
    # vendored-package fallback documented in the README for
    # environments without root. GitHub-hosted runners have real
    # sudo, so this is the one place that verification can happen
    # automatically. Deliberately does NOT attempt to apply nftables
    # rules or bind a live NFQUEUE here — that needs a kernel/runner
    # combination nobody has confirmed supports it reliably in CI;
    # live runs use scripts/field-test-linux.sh on a real machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libnetfilter-queue-dev nftables
      - run: make packet-mode
      - name: capability report (read-only, no privileged action taken)
        run: ./nivyx-packet-engine --capabilities

  sanitize-then-packet-mode:
    # Regression test for a real bug: `make sanitize` leaves ASan/UBSan-
    # instrumented .o files for $(PACKET_OBJ) in the tree, and
    # `make packet-mode` used to relink them as-is (make's mtime
    # check saw no source change), producing undefined __asan_*/
    # __ubsan_* references at link time. `packet-mode` now forces
    # `make clean` first; this job runs the two targets back-to-back
    # in one workspace, which is what exposes the bug if it recurs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libnetfilter-queue-dev nftables
      - run: make sanitize
      - run: make packet-mode
      - run: ./nivyx-packet-engine --capabilities

  macos:
    # Release-grade build (static OpenSSL, macOS >= 11), unit tests
    # plain and under ASan/UBSan, the test package as a tester gets it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "SSL=$RUNNER_TEMP/openssl-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-${{ matrix.arch }}
          key: openssl-3.5.8-${{ matrix.arch }}-macos11-v1
      - name: static OpenSSL 3.5.8 (pinned SHA-256)
        run: ./scripts/macos/build-openssl.sh "$SSL" ${{ matrix.arch }}
      - run: make clean && make all OPENSSL_PREFIX="$SSL" OPENSSL_STATIC=1
      - run: make test OPENSSL_PREFIX="$SSL"
      - run: make sanitize OPENSSL_PREFIX="$SSL"
      # sanitize cleaned the tree: the packaged binary is a fresh plain build
      - run: make clean && make all OPENSSL_PREFIX="$SSL" OPENSSL_STATIC=1
      - name: binary checks
        run: |
          ./nivyx-engine --version
          ./nivyx-engine --capabilities | tee /tmp/cap.txt
          grep -q '^transparent_mode: supported' /tmp/cap.txt
          file nivyx-engine | grep -q "${{ matrix.arch }}"
          otool -L nivyx-engine
          otool -l nivyx-engine | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | grep -E 'minos|version'
          ./nivyx-engine --print-pf-rules
      - name: SOCKS5 smoke test
        run: |
          ./nivyx-engine &
          sleep 1
          curl --socks5 127.0.0.1:1080 -sI https://example.com | tee /tmp/out.txt
          grep -q "HTTP/" /tmp/out.txt
          kill %1 || true
      - name: package
        run: |
          ./scripts/macos/package.sh nivyx-macos-${{ matrix.arch }}
          ditto -c -k --keepParent nivyx-macos-${{ matrix.arch }} nivyx-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-macos-${{ matrix.arch }}
          path: nivyx-macos-${{ matrix.arch }}.zip
      # the admin lock under contention; positive control: the lock of
      # 5d572af (stale-takeover race) must fail the same test
      - name: admin lock race test (+ control)
        run: |
          sh scripts/macos/lock-race-test.sh scripts/macos/nivyx 40
          curl -fsSL -o "$RUNNER_TEMP/old-nivyx" https://raw.githubusercontent.com/kadireren7/nivyx/5d572af/scripts/macos/nivyx
          if CONTROL=1 sh scripts/macos/lock-race-test.sh "$RUNNER_TEMP/old-nivyx" 20; then
            echo "the old lock passed: the test does not reproduce the race here"; exit 1
          fi

  macos-e2e:
    # The real thing on real macOS machines (root, PF, launchd): the
    # zipped package installed as a tester would, then the whole
    # lifecycle (scripts/macos/e2e-test.sh).
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-macos-${{ matrix.arch }}
      - name: extract (as a tester would)
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/pkg"
          ls -l "$RUNNER_TEMP/pkg/nivyx-macos-${{ matrix.arch }}"
      - name: transparent mode end-to-end (PF, launchd, root)
        run: ./scripts/macos/e2e-test.sh "$RUNNER_TEMP/pkg/nivyx-macos-${{ matrix.arch }}"

  linux-e2e:
    # Real install -> intercept -> bypass -> stop -> crash -> uninstall
    # cycle of transparent mode (the runner has sudo and nftables).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - run: ./scripts/e2e-test-linux.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc make perl curl unzip zip openssl
      - name: WinDivert SDK (pinned SHA-256)
        run: ./scripts/windows/fetch-windivert.sh
      # OpenSSL from the pinned official source (scripts/windows/build-openssl.sh),
      # not the MSYS2 package current on the build day; cached
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-win
          key: openssl-win-${{ hashFiles('scripts/macos/build-openssl.sh', 'scripts/windows/build-openssl.sh') }}-v1
      - name: OpenSSL (pinned, static)
        run: ./scripts/windows/build-openssl.sh "$(cygpath -u "$RUNNER_TEMP")/openssl-win"
      - run: make windows CC_WIN=gcc OPENSSL_WIN_PREFIX="$(cygpath -u "$RUNNER_TEMP")/openssl-win"
      - name: unit tests (shared core, native Windows)
        run: |
          make windows-tests CC_WIN=gcc OPENSSL_WIN_PREFIX="$(cygpath -u "$RUNNER_TEMP")/openssl-win"
          for t in tests/unit/test_*.exe; do ./$t; done
      # positive control for test_connect_retry (finding W8): built against
      # the connect code from before the fix, it must fail on Windows -
      # otherwise the test would not reproduce what it guards against
      - name: W8 control (the unfixed connect retry fails test_connect_retry)
        run: |
          # (the checkout is shallow and MSYS2 has no git: the file at that commit)
          curl -fsSL -o tests/unit/net_unfixed.c \
            https://raw.githubusercontent.com/kadireren7/nivyx/a360890/src/transparent/net.c
          grep -q 'connect: socket error %d' tests/unit/net_unfixed.c
          gcc -Wall -Wextra -DHAVE_TRANSPARENT -D_WIN32_WINNT=0x0A00 -D__USE_MINGW_ANSI_STDIO=1 \
            -Iinclude -Isrc/transparent -I"$(cygpath -u "$RUNNER_TEMP")/openssl-win/include" \
            -DNET_C='"net_unfixed.c"' tests/unit/test_connect_retry.c src/compat.win.o \
            -lws2_32 -static -o w8-control.exe
          rm -f tests/unit/net_unfixed.c
          if ./w8-control.exe; then echo "the unfixed code passed: the test does not reproduce W8 here"; exit 1; fi
          echo "unfixed code fails the test as expected (W8 reproduced); the fixed code passes it (unit tests above)"
      - name: package
        run: ./scripts/windows/package.sh dist
      - name: the engine embeds the pinned OpenSSL, with absolute directories
        run: |
          v="$(sed -n 's/^VERSION=//p' scripts/macos/build-openssl.sh)"
          strings dist/files/nivyx-engine.exe | grep -q "^OpenSSL $v " || { echo "nivyx-engine.exe is not built with OpenSSL $v"; exit 1; }
          strings dist/files/nivyx-engine.exe | grep -E '^(OPENSSLDIR|MODULESDIR):'
          ! strings dist/files/nivyx-engine.exe | grep -qE '^(OPENSSLDIR|MODULESDIR): "/'
      - name: SOCKS5 smoke test
        run: |
          ./dist/files/nivyx-engine.exe &
          sleep 1
          curl --socks5 127.0.0.1:1080 -sI https://example.com | tee /tmp/out.txt
          grep -q "HTTP/" /tmp/out.txt
          kill %1 || true
      - name: transparent mode end-to-end (real WinDivert, Administrator)
        shell: pwsh
        run: ./scripts/windows/e2e-test.ps1 -Package dist
      # the exact folder that was just tested, for trying it on a real
      # machine before a release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-windows-x86_64
          path: dist

  linux-arm64:
    # Linux on 64-bit ARM (Raspberry Pi 4/5, ARM servers): built, unit-
    # tested and run through the full end-to-end cycle on a real arm64
    # machine. Installed from source with scripts/install.sh; there is no
    # arm64 release package, so `nivyx update` is not available there.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - run: make re && make test
      - name: transparent mode is built in
        run: |
          ./nivyx-engine --capabilities | grep -q '^transparent_mode: supported'
      - run: ./scripts/tls-verify-test.sh
      - run: ./scripts/e2e-test-linux.sh

  linux-upgrade:
    # older releases (the real tagged source, installed with their own
    # installer) upgraded in place by this tree's installer; the release
    # package installed over v2.4.0, whose own updater must refuse it
    needs: linux-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-linux-x86_64
          path: linux-pkg
      - run: ./scripts/upgrade-test-linux.sh v2.1.0
      - run: ./scripts/upgrade-test-linux.sh v2.2.2
      - run: NIVYX_TEST_PACKAGE="$PWD/linux-pkg/nivyx-linux-x86_64.tar.gz" ./scripts/update-compat-test-linux.sh v2.4.0

  macos-upgrade:
    # the real v2.1.0 release ZIP (checksum-verified) moved over to the
    # nivyx names by the package built from this tree
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-macos-${{ matrix.arch }}
      - name: candidate and v2.1.0 packages
        run: |
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/old"
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/new"
          cd "$RUNNER_TEMP/old"
          base=https://github.com/kadireren7/nivyx/releases/download/v2.1.0
          curl -fsSL -O "$base/nivyx-macos-${{ matrix.arch }}.zip" -O "$base/SHA256SUMS"
          grep " nivyx-macos-${{ matrix.arch }}.zip\$" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip .
          ls
      - name: upgrade v2.1.0 -> candidate (PF, launchd, root)
        run: ./scripts/macos/upgrade-test.sh "$RUNNER_TEMP/old/nivyx-macos-${{ matrix.arch }}" "$RUNNER_TEMP/new/nivyx-macos-${{ matrix.arch }}"

  macos-update:
    # On real Macs: the v2.2.2 / v2.4.0 updaters exactly as released refuse
    # the candidate (new layout) and change nothing; the candidate's
    # installer moves them over with settings and learned state; the
    # candidate's updater rolls back a release that cannot start
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, tag: v2.2.2 }
          - { runner: macos-15, arch: arm64, tag: v2.4.0 }
          - { runner: macos-15-intel, arch: x86_64, tag: v2.4.0 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-macos-${{ matrix.arch }}
          path: candidate
      - name: ${{ matrix.tag }} package (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/old" && cd "$RUNNER_TEMP/old"
          base=https://github.com/kadireren7/nivyx/releases/download/${{ matrix.tag }}
          curl -fsSL -O "$base/nivyx-macos-${{ matrix.arch }}.zip" -O "$base/SHA256SUMS"
          grep " nivyx-macos-${{ matrix.arch }}.zip\$" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip .
      - name: ${{ matrix.tag }} refuses the candidate; the candidate moves it over; rollback (PF, launchd, root)
        run: ./scripts/macos/update-test.sh "$RUNNER_TEMP/old/nivyx-macos-${{ matrix.arch }}" candidate/nivyx-macos-${{ matrix.arch }}.zip

  windows-upgrade:
    # real released packages (checksum-verified) moved over to the nivyx
    # names by the package built from this tree, and the old releases' own
    # updaters refusing it safely, with real WinDivert
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v2.1.0, test: upgrade }
          - { tag: v2.3.0, test: upgrade }
          - { tag: v2.4.0, test: upgrade }
          - { tag: v2.2.2, test: update-compat }
          - { tag: v2.4.0, test: update-compat }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-windows-x86_64
          path: candidate
      - name: ${{ matrix.tag }} package (checksum-verified)
        shell: pwsh
        run: |
          $base = "https://github.com/kadireren7/nivyx/releases/download/${{ matrix.tag }}"
          Invoke-WebRequest "$base/nivyx-windows-x86_64.zip" -OutFile old.zip
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile SHA256SUMS
          $want = (Select-String -Path SHA256SUMS -Pattern 'nivyx-windows-x86_64.zip').Line.Split(' ')[0].ToLower()
          $got = (Get-FileHash old.zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "${{ matrix.tag }} zip checksum mismatch" }
          Expand-Archive old.zip -DestinationPath old
          Get-ChildItem old
      - name: install the candidate over ${{ matrix.tag }} (real WinDivert, Administrator)
        if: matrix.test == 'upgrade'
        shell: pwsh
        run: ./scripts/windows/upgrade-test.ps1 -OldPackage old/nivyx-windows-x86_64 -NewPackage candidate -OldTag ${{ matrix.tag }}
      - name: the ${{ matrix.tag }} updater refuses the candidate safely (real WinDivert, Administrator)
        if: matrix.test == 'update-compat'
        shell: pwsh
        run: ./scripts/windows/update-compat-test.ps1 -OldPackage old/nivyx-windows-x86_64 -NewPackage candidate
