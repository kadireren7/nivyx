name: release

# Two ways in, one path:
#   - a pushed tag v<VERSION> builds, tests and publishes the release;
#   - "Run workflow" (workflow_dispatch) is the DRY RUN: the same CI matrix,
#     packaging, provenance and final-package checks, and
#     nothing is published. Only the publish job can write to the
#     repository, and it runs only for a pushed v* tag (job condition plus a
#     guard step); a dry run never creates a tag or a release.
# A dry run does create build-provenance attestations for its packages
# (that is the provenance step being exercised); they name the branch and
# the dry run, not a tag: users verify a release against its tag
# (docs/security.md).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# least privilege: every job only reads; provenance writes attestations,
# only publish may write repository contents
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: version and mode
        run: |
          ver="$(cat VERSION)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "VERSION is not a release version: $ver"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$ver" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $ver"; exit 1; }
            publish=true
          else
            publish=false
          fi
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "### Release v$ver from tag $GITHUB_REF_NAME" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "### DRY RUN of v$ver from $GITHUB_REF_NAME ($GITHUB_SHA): nothing will be published" >>"$GITHUB_STEP_SUMMARY"
          fi

  # the whole CI matrix (builds, unit/sanitizer tests, end-to-end on Linux,
  # macOS arm64/x86_64 and Windows, upgrade and old-updater tests); its
  # build artifacts are the release packages
  ci:
    needs: preflight
    uses: ./.github/workflows/build.yml

  assemble:
    # the exact file set a release publishes, checked and stored once;
    # every later job uses these bytes
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: nivyx-*
      - name: release files
        run: |
          mkdir -p release
          cp dist/nivyx-linux-x86_64/nivyx-linux-x86_64.tar.gz release/
          cp dist/nivyx-macos-arm64/nivyx-macos-arm64.zip release/
          cp dist/nivyx-macos-x86_64/nivyx-macos-x86_64.zip release/
          # the Windows folder that passed the e2e test in CI, zipped under
          # the top folder name `nivyx update` requires
          mkdir -p win && cp -R dist/nivyx-windows-x86_64 win/nivyx-windows-x86_64
          (cd win && zip -qr -X ../release/nivyx-windows-x86_64.zip nivyx-windows-x86_64)
          # the four packages and SHA256SUMS (`nivyx update` verifies against it)
          (cd release && sha256sum * >../SHA256SUMS) && mv SHA256SUMS release/
      - name: the release set is exactly this, and consistent
        run: |
          want="SHA256SUMS
          nivyx-linux-x86_64.tar.gz
          nivyx-macos-arm64.zip
          nivyx-macos-x86_64.zip
          nivyx-windows-x86_64.zip"
          [ "$(ls release | sort)" = "$(printf '%s\n' "$want" | sed 's/^ *//' | sort)" ] \
            || { echo "unexpected release contents:"; ls release; exit 1; }
          [ "$(awk '{print $2}' release/SHA256SUMS | sort)" = "$(ls release | grep -v '^SHA256SUMS$' | sort)" ] \
            || { echo "SHA256SUMS does not match the release files"; exit 1; }
          (cd release && sha256sum -c SHA256SUMS)
          # every package: exactly the documented top level, and an engine
          # of this version where `nivyx update` looks for it
          ./scripts/check-linux-package.sh release/nivyx-linux-x86_64.tar.gz
          top() { unzip -Z1 "$1" | awk -F/ 'NF > 1 && $2 != "" { print $2 }' | LC_ALL=C sort -u | tr '\n' '|'; }
          for a in arm64 x86_64; do
            z="release/nivyx-macos-$a.zip"
            [ "$(top "$z")" = "Install Nivyx.command|QUICKSTART.txt|Uninstall Nivyx.command|Update Nivyx.command|files|nivyx|" ] \
              || { echo "macOS $a zip top level: $(top "$z")"; exit 1; }
            unzip -Z1 "$z" | grep -qx "nivyx-macos-$a/files/nivyx-engine" || { echo "macOS $a zip lacks files/nivyx-engine"; exit 1; }
            unzip -Z1 "$z" | grep -qx "nivyx-macos-$a/files/install.sh" || { echo "macOS $a zip lacks files/install.sh"; exit 1; }
          done
          z=release/nivyx-windows-x86_64.zip
          [ "$(top "$z")" = "Install Nivyx.cmd|QUICKSTART.txt|Uninstall Nivyx.cmd|Update Nivyx.cmd|files|nivyx.cmd|" ] \
            || { echo "Windows zip top level: $(top "$z")"; exit 1; }
          for f in nivyx-engine.exe WinDivert.dll WinDivert64.sys install.ps1 uninstall.ps1 nivyx-impl.ps1; do
            unzip -Z1 "$z" | grep -qx "nivyx-windows-x86_64/files/$f" || { echo "Windows zip lacks files/$f"; exit 1; }
          done
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  # ---- the final files, as a user downloads them ----------------------------

  final-linux:
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS)
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - name: the final package over v2.4.0 (its updater refuses it; install.sh, update.sh, uninstall.sh)
        run: NIVYX_TEST_PACKAGE="$PWD/release/nivyx-linux-x86_64.tar.gz" ./scripts/update-compat-test-linux.sh v2.4.0

  final-macos:
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && shasum -a 256 -c SHA256SUMS)
      - name: v2.4.0 package (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/old" && cd "$RUNNER_TEMP/old"
          base=https://github.com/kadireren7/nivyx/releases/download/v2.4.0
          curl -fsSL -O "$base/nivyx-macos-${{ matrix.arch }}.zip" -O "$base/SHA256SUMS"
          grep " nivyx-macos-${{ matrix.arch }}.zip\$" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip .
      - name: the final zip, extracted as a tester would, end-to-end (PF, launchd, root)
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          ditto -x -k release/nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/final"
          ./scripts/macos/e2e-test.sh "$RUNNER_TEMP/final/nivyx-macos-${{ matrix.arch }}"
      - name: v2.4.0 refuses the final zip; the final zip moves it over; rollback
        run: ./scripts/macos/update-test.sh "$RUNNER_TEMP/old/nivyx-macos-${{ matrix.arch }}" release/nivyx-macos-${{ matrix.arch }}.zip

  final-windows:
    needs: [preflight, assemble]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - name: checksums; the final zip extracted; v2.4.0 package (checksum-verified)
        shell: pwsh
        run: |
          foreach ($l in Get-Content release/SHA256SUMS) {
            $h, $n = $l -split '\s+', 2
            if ((Get-FileHash "release/$n" -Algorithm SHA256).Hash.ToLower() -ne $h) { throw "checksum mismatch: $n" }
          }
          Expand-Archive release/nivyx-windows-x86_64.zip -DestinationPath final
          $base = 'https://github.com/kadireren7/nivyx/releases/download/v2.4.0'
          Invoke-WebRequest "$base/nivyx-windows-x86_64.zip" -OutFile old.zip
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile OLDSUMS
          $want = (Select-String -Path OLDSUMS -Pattern 'nivyx-windows-x86_64.zip').Line.Split(' ')[0].ToLower()
          if ((Get-FileHash old.zip -Algorithm SHA256).Hash.ToLower() -ne $want) { throw 'v2.4.0 zip checksum mismatch' }
          Expand-Archive old.zip -DestinationPath old
      - name: the final package end-to-end (real WinDivert, Administrator)
        shell: pwsh
        run: ./scripts/windows/e2e-test.ps1 -Package final/nivyx-windows-x86_64
      - name: the v2.4.0 updater (as released) refuses the final zip safely
        shell: pwsh
        run: ./scripts/windows/update-compat-test.ps1 -OldPackage old/nivyx-windows-x86_64 -NewPackage final/nivyx-windows-x86_64 -NewZip release/nivyx-windows-x86_64.zip

  provenance:
    # signed build provenance for every release file, then verified
    # (users: gh attestation verify <file> --repo kadireren7/nivyx
    #  --source-ref refs/tags/v<version>)
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*
      - name: verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" >/dev/null
            echo "attestation verified: ${f#release/}"
          done

  publish:
    # nothing is published unless every CI job, every final-package test and
    # the provenance check passed, and only for a pushed v* tag
    needs: [preflight, assemble, final-linux, final-macos, final-windows, provenance]
    if: needs.preflight.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.preflight.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: guard (a dry run never gets here)
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" = "v$VER" ] \
            || { echo "refusing to publish: not a pushed release tag"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS)
      # The only place a release is created: notes come from
      # .github/release-notes/<tag>.md when present.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          # v1.2.3-rc1, -beta...: a pre-release, never "Latest"
          case "$TAG" in
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          # (the exact set was checked in assemble)
          gh release create "$TAG" release/* \
            --title "Nivyx $TAG" \
            "$@"
