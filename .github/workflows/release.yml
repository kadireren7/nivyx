name: release

on:
  push:
    tags:
      - 'v*'

# least privilege: every job only reads; only publish may write
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make re
      - run: strip dpi-proxy
      - run: ./scripts/package-linux.sh linux-pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-linux-x86_64
          path: |
            dpi-proxy
            linux-pkg/nivyx-linux-x86_64.tar.gz

  # Linux transparent mode must still pass its real end-to-end cycle
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - run: ./scripts/e2e-test-linux.sh

  macos:
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "SSL=$RUNNER_TEMP/openssl-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openssl-${{ matrix.arch }}
          key: openssl-3.5.8-${{ matrix.arch }}-macos11-v1
      - run: ./scripts/macos/build-openssl.sh "$SSL" ${{ matrix.arch }}
      - run: make test OPENSSL_PREFIX="$SSL"
      - run: make clean && make all OPENSSL_PREFIX="$SSL" OPENSSL_STATIC=1
      - run: |
          ./scripts/macos/package.sh nivyx-macos-${{ matrix.arch }}
          ditto -c -k --keepParent nivyx-macos-${{ matrix.arch }} nivyx-macos-${{ matrix.arch }}.zip
      # a release is only built from a package that passed the same
      # end-to-end test as CI, on the machine type it is for
      - name: extract the zip and run the transparent mode end-to-end test
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/pkg"
          ./scripts/macos/e2e-test.sh "$RUNNER_TEMP/pkg/nivyx-macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-macos-${{ matrix.arch }}
          path: nivyx-macos-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl make curl unzip zip
      - run: ./scripts/windows/fetch-windivert.sh
      - run: make windows CC_WIN=gcc OPENSSL_WIN_PREFIX=/mingw64
      - run: ./scripts/windows/package.sh nivyx-windows-x86_64
      # a release is only built from a folder that passed the same
      # end-to-end test as CI
      - name: transparent mode end-to-end (real WinDivert, Administrator)
        shell: pwsh
        run: ./scripts/windows/e2e-test.ps1 -Package nivyx-windows-x86_64
      - run: zip -r nivyx-windows-x86_64.zip nivyx-windows-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivyx-windows-x86_64
          path: nivyx-windows-x86_64.zip

  # the release packages (not the source tree) must upgrade a real v2.1.0
  linux-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - run: ./scripts/upgrade-test-linux.sh v2.1.0

  macos-upgrade:
    needs: macos
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-macos-${{ matrix.arch }}
      - name: release package and v2.1.0 package
        run: |
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/old"
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/new"
          cd "$RUNNER_TEMP/old"
          base=https://github.com/kadireren7/nivyx/releases/download/v2.1.0
          curl -fsSL -O "$base/nivyx-macos-${{ matrix.arch }}.zip" -O "$base/SHA256SUMS"
          grep " nivyx-macos-${{ matrix.arch }}.zip\$" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip .
      - run: ./scripts/macos/upgrade-test.sh "$RUNNER_TEMP/old/nivyx-macos-${{ matrix.arch }}" "$RUNNER_TEMP/new/nivyx-macos-${{ matrix.arch }}"

  windows-upgrade:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nivyx-windows-x86_64
          path: artifact
      - name: release package and v2.1.0 package
        shell: pwsh
        run: |
          Expand-Archive artifact/nivyx-windows-x86_64.zip -DestinationPath new
          $base = 'https://github.com/kadireren7/nivyx/releases/download/v2.1.0'
          Invoke-WebRequest "$base/nivyx-windows-x86_64.zip" -OutFile old.zip
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile SHA256SUMS
          $want = (Select-String -Path SHA256SUMS -Pattern 'nivyx-windows-x86_64.zip').Line.Split(' ')[0].ToLower()
          $got = (Get-FileHash old.zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "v2.1.0 zip checksum mismatch" }
          Expand-Archive old.zip -DestinationPath old
      - shell: pwsh
        run: ./scripts/windows/upgrade-test.ps1 -OldPackage old/nivyx-windows-x86_64 -NewPackage new/nivyx-windows-x86_64

  publish:
    # nothing is published unless every build and every end-to-end
    # and upgrade test (Linux, Windows, macOS arm64 + x86_64) passed
    needs: [linux, linux-e2e, linux-upgrade, macos, macos-upgrade, windows, windows-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: package
        run: |
          mkdir -p release
          cp dist/nivyx-linux-x86_64/dpi-proxy release/nivyx-linux-x86_64
          cp dist/nivyx-linux-x86_64/linux-pkg/nivyx-linux-x86_64.tar.gz release/
          cp dist/nivyx-macos-arm64/nivyx-macos-arm64.zip release/
          cp dist/nivyx-macos-x86_64/nivyx-macos-x86_64.zip release/
          cp dist/nivyx-windows-x86_64/nivyx-windows-x86_64.zip release/
          chmod +x release/nivyx-linux-x86_64
          ver="${{ github.ref_name }}"; ver="${ver#v}"
          ./scripts/gen-sbom.sh "$ver" release > "release/nivyx-$ver.spdx.json"
          (cd release && sha256sum nivyx-linux-x86_64 nivyx-linux-x86_64.tar.gz \
            nivyx-macos-arm64.zip nivyx-macos-x86_64.zip \
            nivyx-windows-x86_64.zip "nivyx-$ver.spdx.json" > SHA256SUMS)
      # signed build provenance for every release file (verify with:
      # gh attestation verify <file> --repo kadireren7/nivyx)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/nivyx-linux-x86_64
            release/nivyx-linux-x86_64.tar.gz
            release/nivyx-macos-arm64.zip
            release/nivyx-macos-x86_64.zip
            release/nivyx-windows-x86_64.zip
            release/*.spdx.json
            release/SHA256SUMS
      # The only place a release is created: notes come from
      # .github/release-notes/<tag>.md when present.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          # v1.2.3-rc1, -beta...: a pre-release, never "Latest"
          case "${{ github.ref_name }}" in
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          gh release create "${{ github.ref_name }}" \
            release/nivyx-linux-x86_64 \
            release/nivyx-linux-x86_64.tar.gz \
            release/nivyx-macos-arm64.zip \
            release/nivyx-macos-x86_64.zip \
            release/nivyx-windows-x86_64.zip \
            release/*.spdx.json \
            release/SHA256SUMS \
            --title "Nivyx ${{ github.ref_name }}" \
            "$@"
