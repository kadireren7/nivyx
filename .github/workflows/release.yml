name: release

# Two ways in, one path:
#   - a pushed tag v<VERSION> builds, tests and publishes the release;
#   - "Run workflow" (workflow_dispatch) is the DRY RUN: the same CI matrix,
#     packaging, manifest, SBOM, provenance and final-package checks, and
#     nothing is published. Only the publish job can write to the
#     repository, and it runs only for a pushed v* tag (job condition plus a
#     guard step); a dry run never creates a tag or a release.
# A dry run does create build-provenance attestations for its packages
# (that is the provenance step being exercised); they name the branch and
# the dry run, not a tag: users verify a release against its tag
# (docs/security.md).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# least privilege: every job only reads; provenance writes attestations,
# only publish may write repository contents
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: version and mode
        run: |
          ver="$(cat VERSION)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "VERSION is not a release version: $ver"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$ver" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $ver"; exit 1; }
            publish=true
          else
            publish=false
          fi
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "### Release v$ver from tag $GITHUB_REF_NAME" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "### DRY RUN of v$ver from $GITHUB_REF_NAME ($GITHUB_SHA): nothing will be published" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: the updaters carry the keys of scripts/release-keys.txt
        run: ./scripts/release-keys.sh check

  # the whole CI matrix (builds, unit/sanitizer tests, end-to-end on Linux,
  # macOS arm64/x86_64 and Windows, upgrade and old-updater tests, updater
  # signature tests); its build artifacts are the release packages
  ci:
    needs: preflight
    uses: ./.github/workflows/build.yml

  assemble:
    # the exact file set a release publishes, checked and stored once;
    # every later job uses these bytes
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: nivyx-*
      - name: release files
        run: |
          mkdir -p release
          cp dist/nivyx-linux-x86_64/nivyx-linux-x86_64.tar.gz release/
          cp dist/nivyx-macos-arm64/nivyx-macos-arm64.zip release/
          cp dist/nivyx-macos-x86_64/nivyx-macos-x86_64.zip release/
          # the Windows folder that passed the e2e test in CI, zipped with the
          # top folder name the updaters of v2.2.x/v2.3.x require
          mkdir -p win && cp -R dist/nivyx-windows-x86_64 win/nivyx-windows-x86_64
          (cd win && zip -qr -X ../release/nivyx-windows-x86_64.zip nivyx-windows-x86_64)
          ./scripts/gen-sbom.sh "$VER" release >"release/nivyx-$VER.spdx.json"
          # the file the maintainer signs offline (docs/release-signing.md)
          ./scripts/release-manifest.sh "$VER" release "$GITHUB_SHA" >release/nivyx-release.manifest
          # Linux users install with scripts/install.sh. The tarball is
          # published only because `nivyx update` (v2.2.x and later)
          # downloads it by this exact name; the bare engine binary is not.
          (cd release && sha256sum nivyx-linux-x86_64.tar.gz nivyx-macos-arm64.zip \
            nivyx-macos-x86_64.zip nivyx-windows-x86_64.zip "nivyx-$VER.spdx.json" \
            nivyx-release.manifest >SHA256SUMS)
      - name: the release set is exactly this, and consistent
        run: |
          want="SHA256SUMS
          nivyx-$VER.spdx.json
          nivyx-linux-x86_64.tar.gz
          nivyx-macos-arm64.zip
          nivyx-macos-x86_64.zip
          nivyx-release.manifest
          nivyx-windows-x86_64.zip"
          [ "$(ls release | sort)" = "$(printf '%s\n' "$want" | sed 's/^ *//' | sort)" ] \
            || { echo "unexpected release contents:"; ls release; exit 1; }
          [ "$(awk '{print $2}' release/SHA256SUMS | sort)" = "$(ls release | grep -v '^SHA256SUMS$' | sort)" ] \
            || { echo "SHA256SUMS does not match the release files"; exit 1; }
          (cd release && sha256sum -c SHA256SUMS)
          ./scripts/release-sign.sh check release "$VER"
          # the packages report this version and have the layout old updaters require
          tar -xzOf release/nivyx-linux-x86_64.tar.gz nivyx-linux-x86_64/dpi-proxy >/dev/null
          # (listings captured first: no `| grep -q` under pipefail)
          for a in arm64 x86_64; do
            l="$(unzip -l "release/nivyx-macos-$a.zip")"
            for f in dpi-proxy nivyx install.sh; do
              grep -q " nivyx-macos-$a/$f\$" <<<"$l" || { echo "macOS $a zip lacks $f"; exit 1; }
            done
          done
          l="$(unzip -l release/nivyx-windows-x86_64.zip)"
          for f in dpi-proxy.exe WinDivert.dll WinDivert64.sys nivyx-impl.ps1 nivyx.cmd install.ps1; do
            grep -q " nivyx-windows-x86_64/$f\$" <<<"$l" || { echo "zip lacks $f"; exit 1; }
          done
          ./scripts/check-linux-package.sh release/nivyx-linux-x86_64.tar.gz
          cat release/nivyx-release.manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  # ---- the final files, as a user downloads them ----------------------------

  final-linux:
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS)
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev nftables
      - name: the v2.3.0 updater (as released) installs the final package
        run: NIVYX_TEST_PACKAGE="$PWD/release/nivyx-linux-x86_64.tar.gz" ./scripts/update-compat-test-linux.sh v2.3.0

  final-macos:
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && shasum -a 256 -c SHA256SUMS)
      - name: v2.3.0 package (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/old" && cd "$RUNNER_TEMP/old"
          base=https://github.com/kadireren7/nivyx/releases/download/v2.3.0
          curl -fsSL -O "$base/nivyx-macos-${{ matrix.arch }}.zip" -O "$base/SHA256SUMS"
          grep " nivyx-macos-${{ matrix.arch }}.zip\$" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k nivyx-macos-${{ matrix.arch }}.zip .
      - name: the final zip, extracted as a tester would, end-to-end (PF, launchd, root)
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          ditto -x -k release/nivyx-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/final"
          ./scripts/macos/e2e-test.sh "$RUNNER_TEMP/final/nivyx-macos-${{ matrix.arch }}"
      - name: the v2.3.0 updater (as released) installs the final zip; rollbacks
        run: ./scripts/macos/update-test.sh "$RUNNER_TEMP/old/nivyx-macos-${{ matrix.arch }}" release/nivyx-macos-${{ matrix.arch }}.zip

  final-windows:
    needs: [preflight, assemble]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - name: checksums; the final zip extracted; v2.3.0 package (checksum-verified)
        shell: pwsh
        run: |
          foreach ($l in Get-Content release/SHA256SUMS) {
            $h, $n = $l -split '\s+', 2
            if ((Get-FileHash "release/$n" -Algorithm SHA256).Hash.ToLower() -ne $h) { throw "checksum mismatch: $n" }
          }
          Expand-Archive release/nivyx-windows-x86_64.zip -DestinationPath final
          $base = 'https://github.com/kadireren7/nivyx/releases/download/v2.3.0'
          Invoke-WebRequest "$base/nivyx-windows-x86_64.zip" -OutFile old.zip
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile OLDSUMS
          $want = (Select-String -Path OLDSUMS -Pattern 'nivyx-windows-x86_64.zip').Line.Split(' ')[0].ToLower()
          if ((Get-FileHash old.zip -Algorithm SHA256).Hash.ToLower() -ne $want) { throw 'v2.3.0 zip checksum mismatch' }
          Expand-Archive old.zip -DestinationPath old
      - name: the final package end-to-end (real WinDivert, Administrator)
        shell: pwsh
        run: ./scripts/windows/e2e-test.ps1 -Package final/nivyx-windows-x86_64
      - name: the v2.3.0 updater (as released) installs the final zip
        shell: pwsh
        run: ./scripts/windows/update-compat-test.ps1 -OldPackage old/nivyx-windows-x86_64 -NewPackage final/nivyx-windows-x86_64 -NewZip release/nivyx-windows-x86_64.zip

  provenance:
    # signed build provenance for every release file, then verified
    # (users: gh attestation verify <file> --repo kadireren7/nivyx
    #  --source-ref refs/tags/v<version>)
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/nivyx-linux-x86_64.tar.gz
            release/nivyx-macos-arm64.zip
            release/nivyx-macos-x86_64.zip
            release/nivyx-windows-x86_64.zip
            release/*.spdx.json
            release/nivyx-release.manifest
            release/SHA256SUMS
      - name: verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" >/dev/null
            echo "attestation verified: ${f#release/}"
          done

  publish:
    # nothing is published unless every CI job, every final-package test and
    # the provenance check passed, and only for a pushed v* tag
    needs: [preflight, assemble, final-linux, final-macos, final-windows, provenance]
    if: needs.preflight.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.preflight.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: guard (a dry run never gets here)
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" = "v$VER" ] \
            || { echo "refusing to publish: not a pushed release tag"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS) && ./scripts/release-sign.sh check release "$VER"
      # The only place a release is created: notes come from
      # .github/release-notes/<tag>.md when present. Once a release key is
      # configured (scripts/release-keys.txt) the release is created as a
      # DRAFT: the maintainer signs nivyx-release.manifest offline, uploads
      # the .sig and publishes it (docs/release-signing.md); updaters that
      # carry the key refuse a release without a valid signature.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          # v1.2.3-rc1, -beta...: a pre-release, never "Latest"
          case "$TAG" in
            *-*) set -- "$@" --prerelease --latest=false ;;
          esac
          if grep -q '^ed25519 ' scripts/release-keys.txt; then
            set -- "$@" --draft
            echo "### Draft release $TAG: sign nivyx-release.manifest offline and upload the .sig before publishing (docs/release-signing.md)" >>"$GITHUB_STEP_SUMMARY"
          fi
          gh release create "$TAG" \
            release/nivyx-linux-x86_64.tar.gz \
            release/nivyx-macos-arm64.zip \
            release/nivyx-macos-x86_64.zip \
            release/nivyx-windows-x86_64.zip \
            release/*.spdx.json \
            release/nivyx-release.manifest \
            release/SHA256SUMS \
            --title "Nivyx $TAG" \
            "$@"
