<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="nivyx status and nivyx doctor sample output">
  <rect width="640" height="380" rx="10" fill="#0d1117"/>
  <rect width="640" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="640" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="320" y="23" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">nivyx</text>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">
    <text x="20" y="66"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9">nivyx status</tspan></text>
    <text x="20" y="90" fill="#22d3ee">Nivyx 2.1.0</text>
    <text x="20" y="112"><tspan fill="#c9d1d9">Service:    </tspan><tspan fill="#3fb950">Running</tspan></text>
    <text x="20" y="134"><tspan fill="#c9d1d9">Protection: </tspan><tspan fill="#3fb950">Active</tspan></text>
    <text x="20" y="156"><tspan fill="#c9d1d9">DNS:        </tspan><tspan fill="#3fb950">Healthy</tspan></text>
    <text x="20" y="178"><tspan fill="#c9d1d9">Mode:       </tspan><tspan fill="#c9d1d9">Transparent</tspan></text>
    <text x="20" y="200"><tspan fill="#c9d1d9">Bypassed:   </tspan><tspan fill="#c9d1d9">128</tspan></text>
    <text x="20" y="222"><tspan fill="#c9d1d9">Failures:   </tspan><tspan fill="#c9d1d9">0</tspan></text>

    <text x="20" y="260"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9">nivyx doctor</tspan></text>
    <text x="20" y="284"><tspan fill="#3fb950">PASS</tspan><tspan fill="#c9d1d9">  Service running</tspan></text>
    <text x="20" y="306"><tspan fill="#3fb950">PASS</tspan><tspan fill="#c9d1d9">  DNS interception healthy</tspan></text>
    <text x="20" y="328"><tspan fill="#3fb950">PASS</tspan><tspan fill="#c9d1d9">  Transparent interception active</tspan></text>
    <text x="20" y="350"><tspan fill="#d29922">WARN</tspan><tspan fill="#c9d1d9">  Another packet filter detected</tspan></text>
  </g>
</svg>
